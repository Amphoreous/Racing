name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 0 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # LOGIC UPDATE: Added check for 'c-cpp' to use windows-latest
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || (matrix.language == 'c-cpp' && 'windows-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # -------------------------------------------------------------------------
    # CUSTOM BUILD STEPS
    # -------------------------------------------------------------------------
    
    - name: Install Visual Studio Build Tools
      if: matrix.build-mode == 'manual' && matrix.language == 'c-cpp'
      uses: microsoft/setup-msbuild@v1.1

    - name: Build project
      if: matrix.build-mode == 'manual' && matrix.language == 'c-cpp'
      shell: cmd
      run: |
        call .\build-VisualStudio2022.bat
        msbuild Racing.sln /p:Configuration=Release /p:Platform=x64 /t:Rebuild

    # -------------------------------------------------------------------------

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
